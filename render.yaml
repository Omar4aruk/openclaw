services:
  - type: web
    name: openclaw
    runtime: image
    image:
      url: ghcr.io/openclaw/openclaw:latest
    plan: free
    envVars:
      - key: OPENCLAW_GATEWAY_PORT
        value: 8080
      - key: OPENCLAW_STATE_DIR
        value: /tmp/.openclaw
      - key: OPENCLAW_WORKSPACE_DIR
        value: /tmp/workspace
      - key: OPENCLAW_DATABASE_URL
        sync: false
      - key: OPENCLAW_ALLOW_UNCONFIGURED
        value: "true"
      - key: OPENCLAW_GATEWAY_TOKEN
        value: "my_super_secret_password"
