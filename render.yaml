services:
  - type: web
    name: openclaw
    runtime: image
    image:
      url: openclaw/openclaw:latest
    plan: free
    envVars:
      - key: OPENCLAW_GATEWAY_PORT
        value: 8080
      - key: OPENCLAW_STATE_DIR
        value: /opt/openclaw/.openclaw
      - key: OPENCLAW_WORKSPACE_DIR
        value: /opt/openclaw/workspace
      - key: OPENCLAW_DATABASE_URL
        sync: false
